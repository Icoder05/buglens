name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Graphviz (used for diagram rendering tests)
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install dependencies (pinned by uv.lock)
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Unit tests
        run: uv run pytest -q
