# BugLens default configuration. Every command reads this file (override with --config).
seed: 42

paths:
  data: data
  repos: data/repos
  cache: data/cache
  pairs: data/pairs
  indexes: data/indexes
  models: data/models
  runs: runs
  onboarding: onboarding
  reports: reports

data:
  # Dataset ids are tried in order; the one that loads is logged (FR-D1, FR-D2).
  lite_ids: ["princeton-nlp/SWE-bench_Lite", "SWE-bench/SWE-bench_Lite"]
  full_ids: ["princeton-nlp/SWE-bench", "SWE-bench/SWE-bench"]

exclusions:                       # FR-D5 (regexes matched against repo-relative POSIX paths)
  path_patterns:
    - '(^|/)tests?/'
    - '(^|/)test_[^/]*\.py$'
    - '_test\.py$'
    - '(^|/)conftest\.py$'
    - '(^|/)docs/'
    - '^setup\.py$'
  max_file_bytes: 1000000

chunking:
  max_chars: 6000                 # FR-C4
  window_lines: 60                # FR-C3
  window_overlap: 20

retrieval:
  top_n: 50                       # FR-R2
  rrf_k: 60                       # FR-R6
  dense_model: nomic-ai/CodeRankEmbed
  dense_model_fallback: BAAI/bge-small-en-v1.5
  use_fallback_model: false
  finetuned_model: data/models/coderankembed-ft
  query_prefix: "Represent this query for searching relevant code: "
  max_seq_length: 512
  batch_size: 32
  fp16: false                     # fp16 is ~4x slower on GTX 16xx (no tensor cores); true on Kaggle T4

training:                         # FR-T1..T3
  max_repo_clone_mb: 300
  max_pairs: 3000
  max_pairs_per_repo: 300         # diversity cap (not in PRD; see CHANGELOG)
  val_fraction: 0.1
  epochs: 1
  lr: 2.0e-5
  warmup_ratio: 0.1
  batch_size: 64
  mini_batch_size: 16
  fp16: false                     # PRD says fp16; slower on GTX 16xx. Set true on Kaggle T4.
  minimal_loop_pairs: 200

rerank:                           # FR-K3
  n_estimators: 300
  learning_rate: 0.05
  num_leaves: 31
  min_child_samples: 20

llm:                              # FR-M1 (verify the free model id in AI Studio)
  model: gemini-2.5-flash
  rpm: 10
  max_requests: 400
  max_issue_chars: 6000
  rerank_top: 10
  rerank_lines: 60
  max_retries: 6

analysis:                         # FR-G2, FR-G3
  pagerank_alpha: 0.85
  pkg_depth: 2
  max_nodes: 15

diagrams:                         # Section 8.3 + NFR readability
  max_package_modules: 25
  max_class_methods: 8
  callflow_depth: 3
  callflow_max_nodes: 20
  max_label_chars: 30

onboard:
  repos: [pallets/flask, psf/requests, django/django]
  max_summary_packages: 30        # FR-S6
  summary_top_symbols: 10         # FR-S1
  strict_citations: true          # FR-S3
  ask_top_k: 8                    # FR-Q1

eval:
  bootstrap_resamples: 1000
  ci: 0.95
